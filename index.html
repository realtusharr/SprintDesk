<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SprintDesk — a sprint management dashboard for software teams. Plan, track and analyze your sprints." />
    <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M17.5 6 9 18h5.5L13 26l8.5-12H16l1.5-8z' fill='white'/%3E%3C/svg%3E"
    />
    <title>SprintDesk — Sprint Management</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sprintdesk-theme");
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
